<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين كلمة مرور جديدة - دائرة البرامج التدريبية</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-cyan:#28A3CC;
    --brand-teal:#1D8FB8;
    --brand-blue:#1D7799;
    --brand-blue-deep:#125A78;
    --gold-300:#E4C874;
    --gold-500:#C9A227;
    --gold-line: rgba(201,162,39,.4);
    --ink-900:#0B3A52;
    --ink-700:#2E5A70;
    --ink-500:#5C808F;
    --glass-bg: rgba(255,255,255,.62);
    --glass-bg-soft: rgba(255,255,255,.38);
    --glass-border: rgba(255,255,255,.75);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100vh; overflow:hidden;
    background: linear-gradient(135deg, var(--brand-cyan) 0%, var(--brand-teal) 45%, var(--brand-blue) 75%, var(--brand-blue-deep) 100%);
    font-family:'Cairo', sans-serif; color: var(--ink-900);
  }
  body::before{
    content:''; position:fixed; inset:0;
    background: radial-gradient(circle at 12% 8%, rgba(255,255,255,.12), transparent 40%), radial-gradient(circle at 88% 92%, rgba(255,255,255,.08), transparent 45%);
    pointer-events:none;
  }
  .auth-wrap{ position:relative; height:100vh; display:flex; align-items:center; justify-content:center; padding: 20px; }
  .auth-panel{
    position:relative; width:100%; max-width:440px; max-height:95vh; overflow-y:auto;
    background: linear-gradient(165deg, var(--glass-bg), var(--glass-bg-soft));
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    border:1px solid var(--glass-border); border-radius:20px; padding:35px 32px 26px;
    box-shadow: 0 30px 70px rgba(8,50,70,.35), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .auth-emblem{
    width:85px; height:85px; margin:0 auto 14px; border-radius:50%;
    background: radial-gradient(circle at 32% 26%, var(--brand-cyan) 0%, var(--brand-teal) 55%, var(--brand-blue-deep) 100%);
    border:2px solid var(--gold-300);
    box-shadow: 0 0 0 5px rgba(255,255,255,.35), 0 14px 28px rgba(8,50,70,.4);
    display:flex; align-items:center; justify-content:center; color: #fff; font-size: 1.8rem;
  }
  .auth-head{ text-align:center; }
  .auth-head h1{ font-family:'Markazi Text', serif; font-weight:700; font-size:1.8rem; margin:0 0 4px; color:var(--ink-900); }
  .auth-head p{ margin:0; font-size:.78rem; color:var(--ink-700); line-height: 1.4; }
  .auth-divider{ display:flex; align-items:center; gap:12px; margin:16px 0; }
  .auth-divider .line{ flex:1; height:1px; background: linear-gradient(to right, transparent, var(--gold-line), transparent); }
  .auth-diamond{ width:7px; height:7px; background: linear-gradient(135deg, var(--gold-300), var(--gold-500)); transform:rotate(45deg); flex-shrink:0; }

  .auth-field{ margin-bottom:14px; }
  .auth-field label{ display:block; font-size:.78rem; font-weight:600; color:var(--ink-700); margin-bottom:5px; }
  .auth-field input{
    width:100%; background: rgba(255,255,255,.55); border:1px solid rgba(11,58,82,.15);
    border-radius:10px; color:var(--ink-900); font-family:'Cairo', sans-serif; font-size:.9rem; padding:9px 12px; outline:none;
  }
  .auth-field input:focus{ border-color: var(--gold-500); background: rgba(255,255,255,.85); box-shadow: 0 0 0 3px rgba(201,162,39,.18); }

  .auth-submit{
    width:100%; padding:11px; margin-top:6px; border:none; border-radius:10px;
    background: linear-gradient(135deg, var(--gold-300), var(--gold-500)); color:#052E47;
    font-family:'Cairo', sans-serif; font-weight:700; font-size:0.92rem; cursor:pointer;
    box-shadow: 0 12px 24px rgba(201,162,39,.35); transition: transform .2s ease;
  }
  .auth-submit:hover{ transform:translateY(-2px); }

  .flash-messages { margin-bottom: 12px; }
  .alert { padding: 7px 10px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 6px; text-align: center; }
  .alert-danger { background-color: rgba(220, 53, 69, 0.12); border: 1px solid rgba(220, 53, 69, 0.35); color: #a3283a; }
  .alert-success { background-color: rgba(40, 167, 69, 0.12); border: 1px solid rgba(40, 167, 69, 0.35); color: #1e7a3d; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-emblem">
      <i class="fas fa-key"></i>
    </div>

    <div class="auth-head">
      <h1>تعيين كلمة مرور جديدة</h1>
      <p>أدخل كلمة المرور الجديدة الخاصة بحسابك</p>
    </div>

    <div class="auth-divider">
      <span class="line"></span>
      <span class="auth-diamond"></span>
      <span class="line"></span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-field">
        <label for="new_password">كلمة المرور الجديدة</label>
        <input type="password" id="new_password" name="new_password" placeholder="6 أحرف أو أرقام على الأقل" required minlength="6">
      </div>

      <div class="auth-field">
        <label for="confirm_password">تأكيد كلمة المرور الجديدة</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="أعد إدخال كلمة المرور الجديدة" required minlength="6">
      </div>

      <button type="submit" class="auth-submit">حفظ كلمة المرور الجديدة</button>
    </form>
  </div>
</div>

</body>
</html>
